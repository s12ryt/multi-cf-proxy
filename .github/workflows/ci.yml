name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (ubuntu, race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通過 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test ./... -race -count=1 -timeout 300s

  build:
    name: Build (linux/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p out
          go build -trimpath -ldflags="-s -w" -o out/multi-cf-proxy-${{ matrix.goos }}-${{ matrix.goarch }} .
          file out/multi-cf-proxy-*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-cf-proxy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/
          retention-days: 14

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Build image (不推送)
        run: docker build -f deploy/Dockerfile -t multi-cf-proxy:ci .
