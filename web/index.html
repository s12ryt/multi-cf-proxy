<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多開CF代理 · 管理界面</title>
<style>
  :root{--bg:#0f1420;--card:#171e2e;--line:#28324a;--tx:#e6ebf5;--dim:#8b97ad;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--acc:#60a5fa}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:20px;margin-bottom:4px} h1 span{color:var(--acc)}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  .card h2{font-size:15px;margin-bottom:12px;color:var(--acc)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{color:var(--dim);font-weight:500}
  tr:last-child td{border-bottom:none}
  .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px}
  .b-ok{background:rgba(52,211,153,.15);color:var(--ok)} .b-bad{background:rgba(248,113,113,.15);color:var(--bad)}
  .b-off{background:rgba(139,151,173,.15);color:var(--dim)}
  button{background:var(--acc);color:#0b1220;border:none;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:600}
  button.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
  button.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
  button:disabled{opacity:.5;cursor:default}
  input,textarea,select{background:#0d1320;border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:8px 10px;font-size:13px;width:100%}
  textarea{font-family:ui-monospace,Consolas,monospace;min-height:110px;resize:vertical}
  label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row>div{flex:1;min-width:130px}
  .actions{display:flex;gap:6px;flex-wrap:wrap}
  .mono{font-family:ui-monospace,Consolas,monospace}
  #login{max-width:360px;margin:14vh auto 0}
  #msg{position:fixed;top:14px;right:14px;padding:10px 16px;border-radius:10px;font-size:13px;display:none;z-index:9}
  .m-ok{background:#123a2c;color:var(--ok);display:block!important}
  .m-err{background:#3a1518;color:var(--bad);display:block!important}
  .hint{font-size:12px;color:var(--dim);margin-top:6px}
  .head{display:flex;justify-content:space-between;align-items:center}
  .num{color:var(--warn)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:800px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="msg"></div>

<!-- 登入 -->
<div id="login" class="card">
  <h1>多開<span>CF</span>代理</h1>
  <p class="sub">請輸入管理員密碼</p>
  <input type="password" id="pw" placeholder="管理員密碼" autofocus>
  <div style="margin-top:12px"><button style="width:100%" onclick="login()">登 入</button></div>
</div>

<!-- 主界面 -->
<div id="main" class="wrap" style="display:none">
  <div class="head">
    <div><h1>多開<span>CF</span>代理</h1><p class="sub" id="ports"></p></div>
    <button class="ghost" onclick="logout()">登出</button>
  </div>

  <div class="card">
    <h2>WARP 上游</h2>
    <table id="upTable"><thead><tr>
      <th>名稱</th><th>狀態</th><th>帳號</th><th>密碼</th><th>重建次數</th><th>流量 ↑/↓</th><th>操作</th>
    </tr></thead><tbody></tbody></table>
    <div class="hint">每個上游自動綁定一組帳密：用該帳密連入即走該 WARP 出口；綁定出口不健康時自動切換其他健康出口。</div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>自動註冊 WARP</h2>
      <div class="row">
        <div><label>數量（1–10）</label><input type="number" id="regCount" value="1" min="1" max="10"></div>
        <div style="flex:0"><button onclick="autoReg()">註冊</button></div>
      </div>
      <p class="hint">調用 Cloudflare API 自動註冊新 WARP 帳號（被風控時請改用手動導入）。</p>
    </div>
    <div class="card">
      <h2>手動導入配置</h2>
      <label>名稱（可留空）</label><input id="impName" placeholder="例如：機場一號">
      <label>wgcf / WireGuard 配置</label><textarea id="impConf" placeholder="[Interface]&#10;PrivateKey = ...&#10;Address = 172.16.0.2/32&#10;&#10;[Peer]&#10;PublicKey = ...&#10;Endpoint = engage.cloudflareclient.com:2408"></textarea>
      <div style="margin-top:10px"><button onclick="importConf()">導入</button></div>
    </div>
  </div>

  <div class="card">
    <h2>帳號流量統計</h2>
    <table id="acctTable"><thead><tr>
      <th>帳號</th><th>出口</th><th>當前連接</th><th>累計連接</th><th>上行</th><th>下行</th><th>最近活躍</th>
    </tr></thead><tbody></tbody></table>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>服務設置</h2>
      <label>SOCKS5 監聽</label><input id="setSocks">
      <label>HTTP 監聽</label><input id="setHttp">
      <label>Web 監聽</label><input id="setWeb">
      <div class="row">
        <div><label>健康檢查間隔（秒）</label><input type="number" id="setInterval"></div>
        <div><label>失敗閾值（次）</label><input type="number" id="setThreshold"></div>
      </div>
      <div style="margin-top:12px"><button onclick="saveSettings()">保存設置</button></div>
      <p class="hint">端口與健康參數保存後需重啟服務生效。</p>
    </div>
    <div class="card">
      <h2>修改管理員密碼</h2>
      <label>新密碼（≥8 位）</label><input type="password" id="newPw">
      <div style="margin-top:12px"><button onclick="changePw()">修改密碼</button></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const fmt = b => {
  if (b === undefined || b === null) return '—';
  const u = ['B','KB','MB','GB','TB']; let i = 0;
  while (b >= 1024 && i < 4) { b /= 1024; i++; }
  return b.toFixed(i ? 1 : 0) + ' ' + u[i];
};
const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
function toast(ok, text) {
  const m = $('msg'); m.textContent = text; m.className = ok ? 'm-ok' : 'm-err';
  setTimeout(() => m.className = '', 3500);
}
async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  if (r.status === 401) { showLogin(); throw new Error('未登入'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
  return data;
}
function showLogin() { $('login').style.display = ''; $('main').style.display = 'none'; }
async function afterLogin() {
  $('login').style.display = 'none'; $('main').style.display = '';
  await refresh(); setInterval(refresh, 5000);
}
async function login() {
  try {
    await api('POST', '/api/login', { password: $('pw').value });
    $('pw').value = ''; await afterLogin();
  } catch (e) { toast(false, e.message); }
}
async function logout() { try { await api('POST', '/api/logout'); } catch(e){} showLogin(); }
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

let overview = null;
async function refresh() {
  try { overview = await api('GET', '/api/overview'); } catch (e) { return; }
  const s = overview.settings;
  $('ports').textContent = `SOCKS5 ${s.listen_socks5} · HTTP ${s.listen_http} · Web ${s.listen_web}`;
  if (document.activeElement !== $('setSocks')) {
    $('setSocks').value = s.listen_socks5; $('setHttp').value = s.listen_http; $('setWeb').value = s.listen_web;
    $('setInterval').value = s.health.interval_seconds; $('setThreshold').value = s.health.failure_threshold;
  }
  const tb = $('upTable').querySelector('tbody'); tb.innerHTML = '';
  for (const u of overview.upstreams) {
    const badge = !u.enabled ? '<span class="badge b-off">停用</span>'
      : u.healthy ? '<span class="badge b-ok">健康</span>'
      : '<span class="badge b-bad" title="'+esc(u.last_error||'')+'">不健康</span>';
    const st = u.stats || {};
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${esc(u.name)}</td>
      <td>${badge}${u.last_error && u.enabled ? '<div class="hint" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(u.last_error)+'</div>' : ''}</td>
      <td class="mono">${esc(u.username)}</td>
      <td class="mono" style="color:var(--dim)">僅生成時可見</td>
      <td class="num">${u.rebuilds}</td>
      <td>${fmt(st.up_bytes + (st.ipv6_up_bytes||0))} / ${fmt(st.down_bytes + (st.ipv6_down_bytes||0))}</td>
      <td class="actions">
        <button class="ghost" onclick="toggle('${u.id}',${!u.enabled})">${u.enabled ? '停用' : '啟用'}</button>
        <button class="ghost" onclick="rebuild('${u.id}')">重建</button>
        <button class="ghost" onclick="regen('${u.id}')">換帳密</button>
        <button class="danger" onclick="del('${u.id}')">刪除</button>
      </td>`;
    tb.appendChild(tr);
  }
  const at = $('acctTable').querySelector('tbody'); at.innerHTML = '';
  for (const a of overview.accounts) {
    const s = a.stats || {};
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="mono">${esc(a.username)}</td><td>${esc(a.upstream)}</td>
      <td class="num">${s.connections ?? 0}</td><td>${s.total_conns ?? 0}</td>
      <td>${fmt(s.up_bytes)}</td><td>${fmt(s.down_bytes)}</td>
      <td>${s.last_active && s.last_active !== '0001-01-01T00:00:00Z' ? new Date(s.last_active).toLocaleString() : '—'}</td>`;
    at.appendChild(tr);
  }
}
async function autoReg() {
  const n = parseInt($('regCount').value || '1');
  try {
    const r = await api('POST', '/api/upstreams/auto', { count: n });
    const list = (r.created || []).map(x => `${x.username}:${x.password}`).join('\n');
    toast(true, `已註冊 ${r.created.length} 個 WARP 帳號`);
    if (list) alert('新增帳密（請立即保存，密碼僅此一次完整顯示）：\n\n' + list);
    refresh();
  } catch (e) { toast(false, e.message); }
}
async function importConf() {
  try {
    const r = await api('POST', '/api/upstreams/import', { conf: $('impConf').value, name: $('impName').value });
    toast(true, `已導入：${r.username}:${r.password}`);
    alert('新增帳密（請立即保存）：\n\n' + r.username + ':' + r.password);
    $('impConf').value = ''; $('impName').value = ''; refresh();
  } catch (e) { toast(false, e.message); }
}
async function toggle(id, enabled) { try { await api('PATCH', '/api/upstreams/' + id, { enabled }); refresh(); } catch (e) { toast(false, e.message); } }
async function rebuild(id) { try { await api('POST', `/api/upstreams/${id}/rebuild`); toast(true, '已觸發重建'); refresh(); } catch (e) { toast(false, e.message); } }
async function regen(id) {
  if (!confirm('重新生成帳密後，舊帳密立即失效。確定？')) return;
  try {
    const r = await api('POST', `/api/upstreams/${id}/credentials`);
    alert('新帳密：\n\n' + r.username + ':' + r.password); refresh();
  } catch (e) { toast(false, e.message); }
}
async function del(id) {
  if (!confirm('確定刪除該上游及其帳密？')) return;
  try { await api('DELETE', '/api/upstreams/' + id); refresh(); } catch (e) { toast(false, e.message); }
}
async function saveSettings() {
  try {
    await api('PUT', '/api/settings', {
      listen_socks5: $('setSocks').value, listen_http: $('setHttp').value, listen_web: $('setWeb').value,
      health: { interval_seconds: parseInt($('setInterval').value || '30'), failure_threshold: parseInt($('setThreshold').value || '3') },
    });
    toast(true, '已保存（重啟後生效）');
  } catch (e) { toast(false, e.message); }
}
async function changePw() {
  try { await api('PUT', '/api/admin/password', { password: $('newPw').value }); $('newPw').value=''; toast(true, '密碼已修改'); }
  catch (e) { toast(false, e.message); }
}
// 啟動：嘗試以現有 session 直接進入
fetch('/api/overview').then(r => { if (r.ok) afterLogin(); }).catch(()=>{});
</script>
</body>
</html>
